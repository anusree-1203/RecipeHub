<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeHub | Reset Password</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <main class="auth-container">
        <section class="auth-box" aria-labelledby="resetHeading">
            <div class="auth-logo">🍴 RecipeHub</div>
            <h2 id="resetHeading">Reset Password</h2>
            <p>Enter your registered email and choose a new password.</p>

            <form id="forgotPasswordForm">
                <label class="sr-only" for="resetEmail">Email address</label>
                <input type="email" id="resetEmail" placeholder="Enter your registered email" autocomplete="email" required>

                <label class="sr-only" for="newPassword">New password</label>
                <input type="password" id="newPassword" placeholder="New password (minimum 6 characters)" minlength="6" autocomplete="new-password" required>

                <label class="sr-only" for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password" minlength="6" autocomplete="new-password" required>

                <button type="submit">Reset Password</button>
            </form>

            <p id="resetMessage" class="form-message" aria-live="polite"></p>
            <p class="auth-switch"><a href="login.html">Back to login</a></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
